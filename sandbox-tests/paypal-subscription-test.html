<!doctype html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Prueba BiblioLink Pro</title>
</head>
<body>
    <h1>BiblioLink Pro - Prueba PayPal</h1>

    <div id="paypal-button-container"></div>

    <script
        src="https://www.paypal.com/sdk/js?client-id=La_key&components=buttons&vault=true&intent=subscription">
    </script>

    <script>
        paypal.Buttons({
            createSubscription(data, actions) {
                return actions.subscription.create({
                    plan_id: 'P-6UP38678LB338224KNKZAGHI'
                });
            },

            onApprove(data) {
                console.log('Suscripción aprobada:', data.subscriptionID);

                alert(
                    `Suscripción aprobada: ${data.subscriptionID}`
                );
            },

            onError(error) {
                console.error('Error de PayPal:', error);
            }
        }).render('#paypal-button-container');
    </script>
</body>
</html>
